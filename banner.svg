<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Daniel Louis Balubar. BSIT Computer Security, Asia Pacific College">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081428"/>
      <stop offset="0.55" stop-color="#0B1D3A"/>
      <stop offset="1" stop-color="#173F82"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B74C9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3B74C9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E53935" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E53935" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FA3FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4FA3FF"/>
      <stop offset="0.8" stop-color="#FF5A5F"/>
      <stop offset="1" stop-color="#FF5A5F" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#4FA3FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- Slow drifting glows -->
  <circle cx="1020" cy="60" r="190" fill="url(#glowBlue)">
    <animate attributeName="cx" values="1020;980;1020" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="280" r="170" fill="url(#glowRed)">
    <animate attributeName="cy" values="280;250;280" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- Faint full ECG line -->
  <path id="ecg" d="M0 222 H470 l12 -10 l12 20 l10 -10 H600 l10 -58 l12 92 l12 -60 l10 26 H760 l12 -10 l12 20 l10 -10 H1200"
        fill="none" stroke="#4FA3FF" stroke-opacity="0.18" stroke-width="2"/>
  <!-- Moving pulse with a soft glow -->
  <path d="M0 222 H470 l12 -10 l12 20 l10 -10 H600 l10 -58 l12 92 l12 -60 l10 26 H760 l12 -10 l12 20 l10 -10 H1200"
        fill="none" stroke="url(#trace)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="220 1300" filter="url(#soft)" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="1520" to="0" dur="3.2s" repeatCount="indefinite"/>
  </path>
  <path d="M0 222 H470 l12 -10 l12 20 l10 -10 H600 l10 -58 l12 92 l12 -60 l10 26 H760 l12 -10 l12 20 l10 -10 H1200"
        fill="none" stroke="url(#trace)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="220 1300">
    <animate attributeName="stroke-dashoffset" from="1520" to="0" dur="3.2s" repeatCount="indefinite"/>
  </path>

  <!-- Heart that beats in time with the pulse -->
  <g transform="translate(1104 66)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.18;1;1.1;1" keyTimes="0;0.12;0.24;0.36;1" dur="1.6s" repeatCount="indefinite"/>
      <path d="M0 14 C-22 -2 -14 -22 0 -12 C14 -22 22 -2 0 14 Z" fill="#FF5A5F"/>
    </g>
  </g>

  <!-- Text fades and rises in -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="64" y="86" fill="#9FC4FF" font-size="16" font-weight="600" letter-spacing="3" opacity="0">
      HELLO, I'M
      <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.6s" fill="freeze"/>
    </text>
    <text x="62" y="140" fill="#FFFFFF" font-size="54" font-weight="700" opacity="0">
      Daniel Louis Balubar
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.7s" fill="freeze"/>
      <animate attributeName="y" from="152" to="140" begin="0.3s" dur="0.7s" fill="freeze"/>
    </text>
    <text x="64" y="176" fill="#D6E2F5" font-size="20" opacity="0">
      BSIT Computer Security · Asia Pacific College
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.7s" fill="freeze"/>
    </text>
  </g>
</svg>
